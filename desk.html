<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Desk Ship Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #status {
      position: fixed;
      z-index: 20;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="status">Desk test: loading Shiptextured.glb</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true;"
  >
    <a-assets>
      <a-asset-item id="ship-model" src="./Shiptextured.glb"></a-asset-item>
    </a-assets>

    <a-entity
      id="ship-display"
      gltf-model="#ship-model"
      position="0 0 -3"
      rotation="210 0 0"
      scale="0.1 0.1 0.1"
    ></a-entity>

    <a-camera position="0 0 0"></a-camera>
  </a-scene>

  <script>
    const status = document.querySelector("#status");
    const ship = document.querySelector("#ship-display");

    ship.addEventListener("model-loaded", () => {
      status.textContent = "Model loaded: Shiptextured.glb";
      status.style.background = "rgba(0, 110, 40, 0.78)";
    });

    ship.addEventListener("model-error", () => {
      status.textContent = "MODEL ERROR: check filename or GLB export";
      status.style.background = "rgba(160, 0, 0, 0.85)";
    });
  </script>
</body>
</html>
