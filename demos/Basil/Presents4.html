<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basil Presentation Viewer - Presents4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    body {
      position: relative;
    }

    /* =========================
       BACKGROUND SLIDESHOW
       ========================= */

    #background-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #111;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.04);
      transition: none;
      animation: slowZoom 18s ease-in-out infinite alternate;
    }

    .bg-slide.active {
      opacity: 1;
    }

    @keyframes slowZoom {
      from {
        transform: scale(1.04);
      }
      to {
        transform: scale(1.11);
      }
    }

    #atmosphere-overlay {
      display: none !important;
      background: none !important;
      opacity: 0 !important;
    }

    /* =========================
       MODEL VIEWER
       ========================= */

    model-viewer {
      position: fixed;
      right: -4%;
      bottom: -7%;
      z-index: 5;
      width: 62vw;
      height: 92vh;
      background: transparent;
      --poster-color: transparent;
    }

    #native-ar-button {
      display: none;
    }

    /* =========================
       TOP BUTTON ROW
       ========================= */

    #top-button-row {
      position: fixed;
      left: 16px;
      right: 24px;
      top: 24px;
      z-index: 10000;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    #left-button-group,
    #right-button-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    #left-button-group {
      flex-direction: column;
      align-items: flex-start;
    }

    #listen-button,
    #next-slide-button,
    #restart-button,
    #next-button {
      width: auto;
      min-width: 104px;
      min-height: 46px;
      padding: 11px 18px;
      border: 0;
      border-radius: 16px;
      background: rgba(244, 240, 232, 0.94);
      color: #18130f;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      display: flex;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    #listen-button:active,
    #next-slide-button:active,
    #restart-button:active,
    #next-button:active {
      transform: translateY(1px);
    }

    /* =========================
       BOTTOM NARRATIVE CAPTION
       ========================= */

    #caption-panel {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    #caption-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #main-caption {
      margin: 0;
      color: #fff;
      font-size: 34px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    #sub-caption {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 18px;
      line-height: 1.35;
    }

    #status-panel {
      position: fixed;
      left: 16px;
      top: 128px;
      z-index: 9999;
      max-width: 380px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      display: none;
    }

    @media (max-width: 700px) {
      model-viewer {
        right: -12%;
        bottom: -8%;
        width: 82vw;
        height: 74vh;
      }

      #top-button-row {
        left: 10px;
        right: 12px;
        top: 12px;
        gap: 8px;
      }

      #left-button-group,
      #right-button-group {
        gap: 7px;
      }

      #listen-button,
      #next-slide-button,
      #restart-button,
      #next-button {
        min-width: 82px;
        min-height: 42px;
        padding: 9px 12px;
        border-radius: 15px;
        font-size: 15px;
      }

      #caption-panel {
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 13px 15px;
        border-radius: 16px;
      }

      #main-caption {
        font-size: 23px;
      }

      #sub-caption {
        font-size: 15px;
      }

      #status-panel {
        left: 10px;
        right: 10px;
        top: 112px;
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <div id="background-stage">
    <div id="bg-a" class="bg-slide active"></div>
    <div id="bg-b" class="bg-slide"></div>
  </div>

  <div id="atmosphere-overlay"></div>

  <model-viewer
    id="basil-viewer"
    src="./SHBuckle.glb?v=1"
    alt="Sutton Hoo buckle model"
    camera-controls
    autoplay
    reveal="auto"
    loading="eager"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral">

    <button id="native-ar-button" slot="ar-button" aria-hidden="true"></button>
  </model-viewer>

  <div id="top-button-row">
    <div id="left-button-group">
      <button id="listen-button" type="button">Listen to Basil</button>
      <button id="next-slide-button" type="button">NEXT SLIDE</button>
    </div>

    <div id="right-button-group">
      <button id="restart-button" type="button">Restart</button>
      <a id="next-button" href="../laurie/laurie.html" aria-label="Open Laurie presentation">NEXT</a>
    </div>
  </div>

  <div id="caption-panel">
    <p id="main-caption">Welcome to Sutton Hoo</p>
    <p id="sub-caption">Basil introduces the story of the ship, the burial and the reconstruction.</p>
  </div>

  <audio id="narration-audio" preload="auto">
    <source src="./BasilIntro.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="status-panel"></div>

  <script>
    const viewer = document.querySelector("#basil-viewer");
    const statusPanel = document.querySelector("#status-panel");

    const bgA = document.querySelector("#bg-a");
    const bgB = document.querySelector("#bg-b");

    const captionPanel = document.querySelector("#caption-panel");
    const mainCaption = document.querySelector("#main-caption");
    const subCaption = document.querySelector("#sub-caption");

    const listenButton = document.querySelector("#listen-button");
    const nextSlideButton = document.querySelector("#next-slide-button");
    const restartButton = document.querySelector("#restart-button");
    const narrationAudio = document.querySelector("#narration-audio");

    let activeBg = bgA;
    let inactiveBg = bgB;
    let currentSlideIndex = 0;
    let presentationStarted = false;

    const slides = [
      {
        time: 0,
        image: "./01Basil.jpg",
        model: "./SHBuckle.glb?v=1",
        alt: "Sutton Hoo buckle model",
        title: "Welcome to Sutton Hoo",
        subtitle: "Basil begins the story of the king, the ship and the burial."
      },
      {
        time: 12,
        image: "./02Edith.jpg",
        model: "./SHBracelet.glb?v=1",
        alt: "Sutton Hoo shoulder clasp model",
        title: "A discovery of national importance",
        subtitle: "The landscape, the mound and the people who brought the story back into view."
      },
      {
        time: 28,
        image: "./03Excavation.jpg",
        model: "./SSHelmet.glb?v=1",
        alt: "Sutton Hoo helmet model",
        title: "The great ship burial",
        subtitle: "A vanished ship survived as an impression in the earth."
      },
      {
        time: 45,
        image: "./04SH198302.jpg",
        model: "./Basil2.glb?v=1",
        alt: "Basil animated guide",
        title: "The story continues",
        subtitle: "Today the ship is being explored through reconstruction and experimental archaeology."
      }
    ];

    function showStatus(message) {
      statusPanel.textContent = message;
      statusPanel.style.display = "block";
    }

    function hideStatus() {
      statusPanel.style.display = "none";
    }

    function setBackground(imageUrl) {
      inactiveBg.style.backgroundImage = "url('" + imageUrl + "')";
      inactiveBg.classList.add("active");
      activeBg.classList.remove("active");

      const oldActive = activeBg;
      activeBg = inactiveBg;
      inactiveBg = oldActive;
    }

    function setCaption(slide) {
      mainCaption.textContent = slide.title;
      subCaption.textContent = slide.subtitle;
      captionPanel.classList.add("visible");
    }

    function setModel(slide) {
      if (!viewer || !slide.model) {
        return;
      }

      if (viewer.getAttribute("src") !== slide.model) {
        viewer.setAttribute("src", slide.model);
      }

      viewer.setAttribute("alt", slide.alt || "Sutton Hoo presentation model");
    }

    function seekAudioToSlide(slide) {
      if (!narrationAudio || !slide || typeof slide.time !== "number") {
        return;
      }

      const wasPlaying = !narrationAudio.paused;
      narrationAudio.currentTime = slide.time;

      if (presentationStarted && wasPlaying) {
        narrationAudio.play().catch(() => {
          showStatus("Audio could not resume after seeking. Tap Listen to Basil again.");
        });
      }
    }

    function showSlide(index, shouldSeekAudio) {
      if (index < 0) {
        index = slides.length - 1;
      }

      if (index >= slides.length) {
        index = 0;
      }

      currentSlideIndex = index;

      const slide = slides[currentSlideIndex];

      hideStatus();
      setBackground(slide.image);
      setCaption(slide);
      setModel(slide);

      if (shouldSeekAudio) {
        seekAudioToSlide(slide);
      }
    }

    function updateSlideByTime(currentTime) {
      let selectedIndex = 0;

      for (let i = 0; i < slides.length; i++) {
        if (currentTime >= slides[i].time) {
          selectedIndex = i;
        }
      }

      if (selectedIndex !== currentSlideIndex) {
        showSlide(selectedIndex, false);
      }
    }

    function nextSlide() {
      presentationStarted = true;
      showSlide(currentSlideIndex + 1, true);
    }

    async function startAudio() {
      try {
        hideStatus();
        presentationStarted = true;

        if (!narrationAudio.src || narrationAudio.src.indexOf("BasilIntro.mp3") === -1) {
          narrationAudio.src = "./BasilIntro.mp3";
        }

        if (narrationAudio.currentTime < slides[currentSlideIndex].time) {
          narrationAudio.currentTime = slides[currentSlideIndex].time;
        }

        await narrationAudio.play();
      } catch (error) {
        showStatus("Audio could not be played. Check that BasilIntro.mp3 is in the same folder as this HTML file.");
        console.error("Audio playback failed:", error);
      }
    }

    function restartPresentation() {
      presentationStarted = false;
      narrationAudio.pause();
      narrationAudio.currentTime = 0;

      activeBg = bgA;
      inactiveBg = bgB;

      bgA.classList.add("active");
      bgB.classList.remove("active");

      bgA.style.backgroundImage = "url('./01Basil.jpg')";
      bgB.style.backgroundImage = "";

      currentSlideIndex = 0;
      showSlide(0, false);
    }

    viewer.addEventListener("load", () => {
      const clips = viewer.availableAnimations || [];
      if (clips.length > 0) {
        viewer.animationName = clips[0];
        viewer.play();
      }
    });

    viewer.addEventListener("error", () => {
      const currentSlide = slides[currentSlideIndex];
      const modelName = currentSlide && currentSlide.model ? currentSlide.model.replace("./", "") : "model";
      showStatus("The model did not load. Check that " + modelName + " is in the same folder as this HTML file and that it is a valid GLB.");
    });

    listenButton.addEventListener("click", startAudio);
    nextSlideButton.addEventListener("click", nextSlide);
    restartButton.addEventListener("click", restartPresentation);

    narrationAudio.addEventListener("timeupdate", () => {
      if (presentationStarted) {
        updateSlideByTime(narrationAudio.currentTime);
      }
    });

    narrationAudio.addEventListener("ended", () => {
      presentationStarted = false;
      captionPanel.classList.add("visible");
    });

    bgA.style.backgroundImage = "url('./01Basil.jpg')";
    showSlide(0, false);
  </script>
</body>
</html>
