<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Basil Presentation Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    body {
      position: relative;
    }

    #background-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background: #111;
    }

    .bg-slide {
      position: absolute;
      inset: 0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 2s ease-in-out;
      animation: slowZoom 18s ease-in-out infinite alternate;
    }

    .bg-slide.active {
      opacity: 1;
    }

    @keyframes slowZoom {
      from {
        transform: scale(1.04);
      }
      to {
        transform: scale(1.11);
      }
    }

    #atmosphere-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255, 220, 150, 0.10) 0%, rgba(0, 0, 0, 0.42) 72%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.58));
    }

    model-viewer {
      position: fixed;
      right: -4%;
      bottom: -7%;
      z-index: 5;
      width: 62vw;
      height: 92vh;
      background: transparent;
      --poster-color: transparent;
    }

    #native-ar-button {
      display: none;
    }

    #launch-panel {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(244, 240, 232, 0.94) 0%, rgba(50, 38, 25, 0.90) 100%);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #launch-panel.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #launch-card {
      width: min(460px, calc(100% - 36px));
      padding: 24px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    #launch-card h1 {
      margin: 0 0 8px;
      color: #1f1a14;
      font-size: 30px;
      line-height: 1.05;
    }

    #launch-card p {
      margin: 0 0 20px;
      color: #4b4034;
      font-size: 17px;
      line-height: 1.35;
    }

    .language-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      padding: 12px 22px;
      border: 0;
      border-radius: 30px;
      background: #111;
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    .language-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .language-button:active {
      transform: translateY(1px);
    }

    .flag-icon {
      width: 46px;
      height: 31px;
      object-fit: cover;
      border-radius: 3px;
    }

    #caption-panel {
      position: fixed;
      left: 24px;
      bottom: 92px;
      z-index: 10;
      width: min(520px, calc(100% - 48px));
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }

    #caption-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #main-caption {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    #sub-caption {
      margin: 8px 0 0;
      font-size: 17px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.88);
    }

    #info-card {
      position: fixed;
      left: 24px;
      top: 24px;
      z-index: 10;
      max-width: 360px;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(244, 240, 232, 0.92);
      color: #18130f;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    #info-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #bottom-controls {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 12;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      pointer-events: auto;
    }

    .control-button {
      min-height: 46px;
      padding: 9px 15px;
      border-radius: 24px;
      border: 2px solid #111;
      background: rgba(244, 240, 232, 0.94);
      color: #111;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .control-button.dark {
      border-color: #111;
      background: #111;
      color: #fff;
    }

    #status-panel {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 30;
      max-width: 380px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      display: none;
    }

    @media (max-width: 700px) {
      model-viewer {
        right: -22%;
        bottom: -10%;
        width: 108vw;
        height: 82vh;
      }

      #caption-panel {
        left: 12px;
        right: 12px;
        bottom: 78px;
        width: auto;
        padding: 13px 15px;
      }

      #main-caption {
        font-size: 23px;
      }

      #sub-caption {
        font-size: 15px;
      }

      #info-card {
        left: 12px;
        top: 12px;
        max-width: calc(100% - 24px);
        font-size: 15px;
      }

      #launch-card h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <div id="background-stage">
    <div id="bg-a" class="bg-slide active"></div>
    <div id="bg-b" class="bg-slide"></div>
  </div>

  <div id="atmosphere-overlay"></div>

  <model-viewer
    id="basil-viewer"
    src="./Basil.glb?v=1"
    alt="Basil animated guide"
    camera-controls
    autoplay
    reveal="auto"
    loading="eager"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="auto"
    ar-placement="floor">

    <button id="native-ar-button" slot="ar-button" aria-hidden="true"></button>
  </model-viewer>

  <div id="launch-panel">
    <div id="launch-card">
      <h1>Listen to Basil</h1>
      <p>Choose a language to begin the presentation.</p>

      <div class="language-list">
        <button id="english-button" class="language-button" data-audio="./BasilIntro.mp3" data-language="English" type="button">
          <img class="flag-icon" src="./UKflag.jpg" alt="">
          English
        </button>

        <button id="dutch-button" class="language-button" data-audio="./Dutch.mp3" data-language="Dutch" type="button">
          <img class="flag-icon" src="./Dutchflag.jpg" alt="">
          Dutch
        </button>
      </div>
    </div>
  </div>

  <div id="info-card"></div>

  <div id="caption-panel">
    <p id="main-caption">Welcome to Sutton Hoo</p>
    <p id="sub-caption">Basil introduces the story of the ship, the burial and the reconstruction.</p>
  </div>

  <audio id="narration-audio" preload="auto">
    <source src="./BasilIntro.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="bottom-controls">
    <button id="restart-button" class="control-button dark" type="button">Restart</button>
    <button id="room-ar-button" class="control-button" type="button">View outside</button>
  </div>

  <div id="status-panel"></div>

  <script>
    const viewer = document.querySelector("#basil-viewer");
    const launchPanel = document.querySelector("#launch-panel");
    const languageButtons = document.querySelectorAll(".language-button");
    const narrationAudio = document.querySelector("#narration-audio");
    const roomArButton = document.querySelector("#room-ar-button");
    const restartButton = document.querySelector("#restart-button");
    const statusPanel = document.querySelector("#status-panel");

    const bgA = document.querySelector("#bg-a");
    const bgB = document.querySelector("#bg-b");

    const captionPanel = document.querySelector("#caption-panel");
    const mainCaption = document.querySelector("#main-caption");
    const subCaption = document.querySelector("#sub-caption");
    const infoCard = document.querySelector("#info-card");

    let activeBg = bgA;
    let inactiveBg = bgB;
    let currentSlideIndex = -1;
    let presentationStarted = false;
    let currentAudioSrc = "./BasilIntro.mp3";

    const slides = [
      {
        time: 0,
        image: "./01Basil.jpg",
        title: "Welcome to Sutton Hoo",
        subtitle: "Basil begins the story of the king, the ship and the burial.",
        card: "Sutton Hoo"
      },
      {
        time: 12,
        image: "./02Edith.jpg",
        title: "A discovery of national importance",
        subtitle: "The landscape, the mound and the people who brought the story back into view.",
        card: "The excavation story"
      },
      {
        time: 28,
        image: "./03Excavation.jpg",
        title: "The great ship burial",
        subtitle: "A vanished ship survived as an impression in the earth.",
        card: "c. 27 metres long"
      },
      {
        time: 45,
        image: "./04SH198302.jpg",
        title: "The story continues",
        subtitle: "Today the ship is being explored through reconstruction and experimental archaeology.",
        card: "Experimental archaeology"
      }
    ];

    function showStatus(message) {
      statusPanel.textContent = message;
      statusPanel.style.display = "block";
    }

    function hideStatus() {
      statusPanel.style.display = "none";
    }

    function setBackground(imageUrl) {
      inactiveBg.style.backgroundImage = "url('" + imageUrl + "')";
      inactiveBg.classList.add("active");
      activeBg.classList.remove("active");

      const oldActive = activeBg;
      activeBg = inactiveBg;
      inactiveBg = oldActive;
    }

    function setCaption(slide) {
      mainCaption.textContent = slide.title;
      subCaption.textContent = slide.subtitle;
      infoCard.textContent = slide.card;

      captionPanel.classList.add("visible");
      infoCard.classList.add("visible");
    }

    function updateSlideByTime(currentTime) {
      let selectedIndex = 0;

      for (let i = 0; i < slides.length; i++) {
        if (currentTime >= slides[i].time) {
          selectedIndex = i;
        }
      }

      if (selectedIndex !== currentSlideIndex) {
        currentSlideIndex = selectedIndex;
        const slide = slides[selectedIndex];
        setBackground(slide.image);
        setCaption(slide);
      }
    }

    function resetPresentationVisuals() {
      currentSlideIndex = -1;
      activeBg = bgA;
      inactiveBg = bgB;

      bgA.classList.add("active");
      bgB.classList.remove("active");

      bgA.style.backgroundImage = "url('./01Basil.jpg')";
      bgB.style.backgroundImage = "";

      captionPanel.classList.remove("visible");
      infoCard.classList.remove("visible");
    }

    async function startPresentation(audioSrc = currentAudioSrc, language = "English") {
      try {
        hideStatus();
        presentationStarted = true;

        launchPanel.classList.add("hidden");
        resetPresentationVisuals();

        currentAudioSrc = audioSrc;

        narrationAudio.pause();
        narrationAudio.currentTime = 0;
        narrationAudio.src = audioSrc;

        updateSlideByTime(0);

        if (viewer && typeof viewer.play === "function") {
          viewer.play();
        }

        await narrationAudio.play();
      } catch (error) {
        const fileName = audioSrc.replace("./", "");
        showStatus("Audio could not be played. Check that " + fileName + " is in the same folder as this HTML file.");
        console.error(language + " audio playback failed:", error);
      }
    }

    function restartPresentation() {
      startPresentation();
    }

    viewer.addEventListener("load", () => {
      const clips = viewer.availableAnimations || [];
      if (clips.length > 0) {
        viewer.animationName = clips[0];
        viewer.play();
      }
    });

    viewer.addEventListener("error", () => {
      showStatus("The model did not load. Check that Basil.glb is in the same folder as this HTML file and that it is a valid GLB.");
    });

    narrationAudio.addEventListener("timeupdate", () => {
      if (presentationStarted) {
        updateSlideByTime(narrationAudio.currentTime);
      }
    });

    narrationAudio.addEventListener("ended", () => {
      captionPanel.classList.add("visible");
      infoCard.classList.add("visible");
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        startPresentation(button.dataset.audio, button.dataset.language);
      });
    });

    restartButton.addEventListener("click", restartPresentation);

    roomArButton.addEventListener("click", async () => {
      try {
        if (typeof viewer.activateAR === "function") {
          await viewer.activateAR();
        } else {
          showStatus("AR view is not available in this browser. Open this page on a compatible Android or iPhone device.");
        }
      } catch (error) {
        showStatus("AR view is not available on this device/browser. Open this page on a compatible Android or iPhone device.");
        console.error("AR launch failed:", error);
      }
    });

    bgA.style.backgroundImage = "url('./01Basil.jpg')";
  </script>
</body>
</html>
