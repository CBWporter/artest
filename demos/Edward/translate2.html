<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eirik Ironhand Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f0e8;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #f8f4ec 0%, #e2d8c8 72%);
    }

    
    #top-controls {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      width: auto;
      max-width: calc(100% - 32px);
      padding: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }

    #listen-label {
      margin: 0 0 2px;
      color: #222;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 800;
      text-align: left;
    }

    .language-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: auto;
    }

    .control-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      width: 74px;
      min-height: 48px;
      padding: 8px 10px;
      border: 0;
      border-radius: 24px;
      background: #111;
      color: #fff;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: none;
      text-align: center;
    }

    .control-button:active {
      transform: translateY(1px);
    }

    .control-button.playing {
      outline: 3px solid rgba(17, 17, 17, 0.22);
      background: #2b2b2b;
    }

    .flag-icon {
      width: 46px;
      height: 31px;
      object-fit: cover;
      border-radius: 3px;
      flex: 0 0 auto;
    }

    #room-ar-button {
      width: 100%;
      min-height: 46px;
      justify-content: center;
      background: #f4f0e8;
      color: #111;
      border: 2px solid #111;
      font-size: 18px;
      padding: 9px 14px;
    }

    /* This hides the native model-viewer AR slot button so only our visible button appears. */
    #native-ar-button {
      display: none;
    }

    #status-panel {
      position: fixed;
      left: 16px;
      top: 250px;
      z-index: 9999;
      max-width: 380px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 13px;
      line-height: 1.35;
      display: none;
    }

    #info-panel {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 9999;
      padding: 8px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      pointer-events: auto;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.22);
    }

    @media (max-width: 520px) {
      #top-controls {
        left: 10px;
        top: 10px;
        width: auto;
        max-width: calc(100% - 20px);
        padding: 9px 10px 10px;
      }

      #listen-label {
        font-size: 19px;
      }

      .control-button {
        width: 68px;
        min-height: 44px;
        padding: 7px 9px;
        font-size: 18px;
      }

      .flag-icon {
        width: 44px;
        height: 29px;
      }

      #room-ar-button {
        width: 100%;
        min-height: 44px;
        padding: 8px 12px;
        font-size: 17px;
      }

      #status-panel {
        left: 10px;
        right: 10px;
        top: 170px;
        max-width: none;
      }
    }
  </style>
</head>

<body>
  <model-viewer
    id="Eirik-viewer"
    src="./Edward.glb?v=5"
    alt="Eirik Ironhand animated Viking character"
    camera-controls
    autoplay
    reveal="auto"
    loading="eager"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    ar
    ar-modes="scene-viewer quick-look webxr"
    ar-scale="auto"
    ar-placement="floor">

    <button id="native-ar-button" slot="ar-button" aria-hidden="true"></button>
  </model-viewer>

  <div id="top-controls" aria-label="Audio language controls">
    <h1 id="listen-label">Listen to Erik</h1>

    <div class="language-list">
      <button id="english-button" class="control-button language-button" data-audio="./Edward.mp3" data-language="English" type="button">
        <img class="flag-icon" src="./UKflag.jpg" alt="">
      </button>

      <button id="dutch-button" class="control-button language-button" data-audio="./Dutch.mp3" data-language="Dutch" type="button">
        <img class="flag-icon" src="./Dutchflag.jpg" alt="">
      </button>
    </div>
  </div>

  <div id="status-panel"></div>

  <audio id="narration-audio" preload="auto">
    <source src="./Edward.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="info-panel">
    <button id="room-ar-button" class="control-button" type="button">View outside</button>
  </div>

  <script>
    const viewer = document.querySelector("#Eirik-viewer");
    const languageButtons = document.querySelectorAll(".language-button");
    const roomArButton = document.querySelector("#room-ar-button");
    const statusPanel = document.querySelector("#status-panel");
    const narrationAudio = document.querySelector("#narration-audio");

    let currentLanguageButton = null;

    function showStatus(message) {
      statusPanel.textContent = message;
      statusPanel.style.display = "block";
    }

    function clearPlayingState() {
      languageButtons.forEach((button) => {
        button.classList.remove("playing");
      });
    }

    viewer.addEventListener("load", () => {
      const clips = viewer.availableAnimations || [];
      if (clips.length > 0) {
        viewer.animationName = clips[0];
        viewer.play();
      }
    });

    viewer.addEventListener("error", () => {
      showStatus("The model did not load. Check that Edward.glb is in the same folder as this HTML file and that the file is a valid GLB.");
    });

    languageButtons.forEach((button) => {
      button.addEventListener("click", async () => {
        const audioSrc = button.dataset.audio;
        const language = button.dataset.language;

        try {
          if (currentLanguageButton === button && !narrationAudio.paused) {
            narrationAudio.pause();
            clearPlayingState();
            return;
          }

          if (currentLanguageButton !== button) {
            narrationAudio.pause();
            narrationAudio.src = audioSrc;
            narrationAudio.currentTime = 0;
            currentLanguageButton = button;
          }

          await narrationAudio.play();
          clearPlayingState();
          button.classList.add("playing");
        } catch (error) {
          clearPlayingState();
          showStatus("Audio could not be played. Check that " + audioSrc.replace("./", "") + " is in the same folder as this HTML file.");
          console.error(language + " audio playback failed:", error);
        }
      });
    });

    narrationAudio.addEventListener("ended", () => {
      clearPlayingState();
    });

    roomArButton.addEventListener("click", async () => {
      try {
        if (typeof viewer.activateAR === "function") {
          await viewer.activateAR();
        } else {
          showStatus("AR view is not available in this browser. Open this page on a compatible Android or iPhone device.");
        }
      } catch (error) {
        showStatus("AR view is not available on this device/browser. Open this page on a compatible Android or iPhone device.");
        console.error("AR launch failed:", error);
      }
    });
  </script>
</body>
</html>
