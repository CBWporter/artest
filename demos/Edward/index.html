<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Eirik Ironhand Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Standard model-viewer page. No AR room placement. -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #111;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #3a3a3a 0%, #151515 70%);
    }

    #audio-button {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 9999;
      background: #fff;
      border: 0;
      border-radius: 12px;
      color: #111;
      font-size: 20px;
      font-weight: bold;
      padding: 18px 24px;
      min-width: 190px;
      min-height: 56px;
      cursor: pointer;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
    }

    #audio-button:active {
      transform: translateY(1px);
    }

    #info-panel {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 14px;
      line-height: 1.35;
      pointer-events: none;
    }

    #info-panel strong {
      display: block;
      font-size: 17px;
      margin-bottom: 3px;
    }

    @media (max-width: 480px) {
      #audio-button {
        font-size: 18px;
        padding: 16px 22px;
        min-width: 180px;
        min-height: 56px;
      }
    }
  </style>
</head>

<body>
  <model-viewer
    id="Eirik-viewer"
    src="./Edward.glb"
    alt="Eirik Ironhand animated character"
    camera-controls
    autoplay
    reveal="auto"
    loading="eager"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    camera-orbit="0deg 75deg 4m"
    field-of-view="30deg">
  </model-viewer>

  <button id="audio-button">Listen to Eirik</button>

  <audio id="Edward-audio" preload="auto">
    <source src="./Edward.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <div id="info-panel">
    <strong>Eirik Ironhand</strong>
    Use your mouse or finger to rotate the model. Tap “Listen to Eirik” to hear the introduction.
  </div>

 <script>
  const viewer = document.querySelector("#Eirik-viewer");
  const audioButton = document.querySelector("#audio-button");
  const edwardAudio = document.querySelector("#Edward-audio");

  viewer.addEventListener("load", () => {
    const clips = viewer.availableAnimations || [];
    if (clips.length > 0) {
      viewer.animationName = clips[0];
      viewer.play();
    }
  });

  audioButton.addEventListener("click", async () => {
    try {
      if (edwardAudio.paused) {
        await edwardAudio.play();
        audioButton.textContent = "Pause Eirik";
      } else {
        edwardAudio.pause();
        audioButton.textContent = "Listen to Eirik";
      }
    } catch (error) {
      audioButton.textContent = "Audio unavailable";
      console.error("Audio playback failed:", error);
    }
  });

  edwardAudio.addEventListener("ended", () => {
    audioButton.textContent = "Listen to Eirik";
  });
</script>
</body>
</html>
