<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sutton Hoo Ship 04 - HIRO AR Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
    }

    #status,
    #instructions {
      display: none;
    }
  </style>
</head>

<body>
  <div id="status">Looking for HIRO marker...</div>

  <div id="instructions">
    <strong>SUTTON HOO SHIP 04 — v030 — no GPS</strong>
    Uses SuttonHooShip04.glb. Static HIRO marker AR test.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  >
    <a-assets>
      <a-asset-item id="ship-model" src="./SuttonHooShip04.glb"></a-asset-item>
    </a-assets>

    <a-marker
      preset="hiro"
      id="hiro-marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <a-entity
        id="ship-display"
        gltf-model="#ship-model"
        position="-0.4 0.05 0"
        rotation="210 0 0"
        scale="0.02 0.02 0.02"
        animation="property: position; from: -0.4 0.05 0; to: 0.4 0.05 0; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine"
      ></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const marker = document.querySelector("#hiro-marker");

    marker.addEventListener("markerFound", () => {
      console.log("Marker found - SuttonHooShip04.glb");
    });

    marker.addEventListener("markerLost", () => {
      console.log("Marker lost");
    });
  </script>
</body>
</html>
